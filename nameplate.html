<!doctype html>
<html lang="vi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng tên UEL</title>
<style>
@font-face{font-family:Lato;src:url('assets/lato-regular.ttf') format('truetype');font-weight:400;font-display:swap}@font-face{font-family:Lato;src:url('assets/lato-black.ttf') format('truetype');font-weight:900;font-display:swap}
:root{color-scheme:dark;--bg:#10111c;--panel:#191a2a;--text:#f4f2fc;--muted:#aaa8bc;--line:#ffffff18;--accent:#cda2fb;--input:#10111c}[data-theme=light]{color-scheme:light;--bg:#f5f3fa;--panel:#fff;--text:#242137;--muted:#686278;--line:#261b3d22;--accent:#7640aa;--input:#f6f4fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Lato,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:10px 15px}button:disabled{opacity:.5;cursor:wait}input,textarea,select{background:var(--input);border:1px solid var(--line);border-radius:7px;width:100%;padding:10px 12px;min-width:0}textarea{resize:vertical;min-height:70px}input[type=color]{height:43px;padding:5px}input[type=range]{padding:0}label{display:grid;gap:6px;font-size:13px}h1,h2,p{margin:0}h1{font-size:30px;line-height:1.25}h2{font-size:17px}p{color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;margin-bottom:24px;border-bottom:1px solid var(--line)}main{width:min(1320px,calc(100% - 40px));margin:auto;padding-bottom:40px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:22px}.stack{display:grid;gap:18px}.templates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.template{padding:12px 3px;font-size:12px}.template[aria-pressed=true]{background:linear-gradient(115deg,#a43883,#7247b3,#3f58bb);color:white}.preview-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#144E8C;aspect-ratio:24/13.5}.preview-wrap canvas{display:block;width:100%;height:100%;object-fit:contain}small,.small{font-size:12px;color:var(--muted)}.primary{background:linear-gradient(115deg,#a43883,#7247b3,#3f58bb);border:0;color:white;font-weight:700}.message{font-size:13px;color:var(--accent);min-height:22px}.error{color:#ef9c9c}.status-bar{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding-top:14px}details{border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;color:var(--accent)}details>div{margin-top:15px;display:grid;gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.preview-panel{grid-row:1}.panel{padding:17px}header{padding:20px 0;align-items:start}h1{font-size:25px}main{width:calc(100% - 28px)}.preview-panel .row button{flex:1}header .row{flex-wrap:nowrap}header button{font-size:12px;padding:8px 10px}}
</style><style>:root,[data-theme=dark],[data-theme=light]{color-scheme:light;--bg:#faf9f5;--panel:#fff;--text:#333;--muted:#74746f;--accent:#805e31;--border:#ddd;--line:#ddd}body{background:#faf9f5!important;color:#333!important}header{display:none!important}main{padding:12px!important}button{box-shadow:none!important}</style><style>:root,[data-theme=dark],[data-theme=light]{--input:#fff;--panel:#fff;--text:#343630;--muted:#77796f;--accent:#80613c}body{font-family:Lato,Segoe UI,sans-serif}.primary,.template[aria-pressed=true]{background:#373b32!important;color:#fff!important}button,input,textarea,select,.card{border-radius:3px!important}main{max-width:none!important}</style></head><body><main><header><div><div class="eyebrow">UEL / DESIGN DESK</div><h1 id="title"></h1><p id="subtitle" style="margin-top:8px"></p></div><div class="row"><button id="language">EN</button><button id="theme">☀</button></div></header><div class="layout"><section class="panel stack" id="controls"></section><section class="panel preview-panel stack"><div class="row" style="justify-content:space-between"><h2 id="preview-label"></h2><small>24 × 13.5 cm · 16:9</small></div><div class="preview-wrap"><canvas id="preview" width="2835" height="1594" aria-label="Bảng tên xem trước"></canvas></div><div class="status-bar"><small id="template-state"></small><small>PNG · 2835 × 1594 px · 300 DPI / PDF · 24 × 13.5 cm</small></div><div class="row"><button class="primary" id="download-png">PNG ↓</button><button id="download-pdf">PDF ↓</button></div><p class="message" id="message" role="status"></p></section></div></main>
<script>
/* 4 PHÔI CHÍNH THỨC: thêm đúng tên vào assets/ sau khi duyệt bản thử. */
const templates=[1,2,3,4].map(n=>({name:'UEL 0'+n,path:'assets/bang-ten-phoi-0'+n+'.png',background:['#144E8C','#f7f7fa','#182c47','#213f63'][n-1],colour:n===2?'#144E8C':'#ffffff'}));
const state={template:0,name:'NGUYỄN VĂN AN',role:'Chức vụ / Chức danh',unit:'Đơn vị công tác',colour:'#ffffff',nameSize:100,detailSize:52,position:48,image:null,busy:false,overflow:false};
let language='vi',dark=false,drawVersion=0,templateVersion=0,fontReady=false,temporaryImage=false;
const $=s=>document.querySelector(s),tr=(vi,en)=>language==='vi'?vi:en,escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function controls(){return '<div><h2>'+tr('Chọn phôi','Choose a template')+'</h2><div class="templates" style="margin-top:12px">'+templates.map((t,i)=>'<button class="template" data-template="'+i+'" aria-pressed="'+(i===state.template)+'">'+t.name+'</button>').join('')+'</div></div><label>'+tr('Họ và tên','Full name')+'<textarea id="name" maxlength="120">'+escapeText(state.name)+'</textarea></label><label>'+tr('Chức vụ','Position')+'<textarea id="role" maxlength="160">'+escapeText(state.role)+'</textarea></label><label>'+tr('Đơn vị','Organisation')+'<textarea id="unit" maxlength="180">'+escapeText(state.unit)+'</textarea></label><label>'+tr('Màu chữ','Text colour')+'<input id="text-colour" type="color" value="'+state.colour+'"></label><details><summary>'+tr('Tinh chỉnh','Fine-tune')+'</summary><div><label>'+tr('Cỡ họ tên','Name size')+'<input id="name-size" type="range" min="60" max="140" value="'+state.nameSize+'"></label><label>'+tr('Cỡ chức vụ và đơn vị','Position and organisation size')+'<input id="detail-size" type="range" min="30" max="72" value="'+state.detailSize+'"></label><label>'+tr('Vị trí cả nhóm chữ','Text group position')+'<input id="text-position" type="range" min="30" max="70" value="'+state.position+'"></label><button id="reset">'+tr('Đặt lại kiểu chữ','Reset text style')+'</button></div></details><details><summary>'+tr('Thử phôi từ máy','Try a local background')+'</summary><div><input type="file" id="background-file" accept="image/png,image/jpeg,image/webp"><small>'+tr('Chỉ dùng để thử. Sau khi chốt, thêm file đúng tên vào assets/.','For preview only. Once approved, add the correctly named file to assets/.')+'</small></div></details><p class="small">'+tr('Tạo bảng tên và tải trực tiếp. Họ tên Lato Black, hai dòng còn lại Lato Regular.','Standalone preview; not yet added to tab 09. Lato Black for the name, Lato Regular for the other fields.')+'</p>'}
function render(){$('#title').textContent=tr('Tạo bảng tên','Nameplates · Preview');$('#subtitle').textContent=tr('Chọn phôi, nhập nội dung, xem và tải ngay.','Choose a template, enter your text and download.');$('#preview-label').textContent=tr('Xem trước','Preview');$('#language').textContent=language==='vi'?'EN':'VIE';$('#theme').textContent=dark?'☀':'☾';$('#theme').setAttribute('aria-label',tr('Đổi sáng/tối','Toggle theme'));document.documentElement.lang=language;$('#controls').innerHTML=controls();updateStatus();draw()}
async function loadTemplate(){const version=++templateVersion;temporaryImage=false;state.image=null;state.colour=templates[state.template].colour;const im=new Image();im.onload=()=>{if(version!==templateVersion)return;state.image=im;updateStatus();draw()};im.onerror=()=>{if(version!==templateVersion)return;updateStatus();draw()};im.src=templates[state.template].path;render()}
function updateStatus(){$('#template-state').textContent=temporaryImage?tr('Đang thử phôi từ máy','Using a local background'):state.image?templates[state.template].name:tr('Phôi tạm · Chờ bổ sung ','Placeholder · Add ')+templates[state.template].path}
function wrap(ctx,text,maxWidth){const lines=[];for(const paragraph of text.replace(/\r/g,'').split('\n')){const words=paragraph.trim().split(/\s+/).filter(Boolean);let line='';for(const word of words){if(ctx.measureText(word).width>maxWidth){if(line){lines.push(line);line=''}let chunk='';for(const char of word){if(chunk&&ctx.measureText(chunk+char).width>maxWidth){lines.push(chunk);chunk=char}else chunk+=char}line=chunk}else if(line&&ctx.measureText(line+' '+word).width>maxWidth){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line)}return lines}
function fit(ctx,text,size,weight){let lines=[];for(let current=size;current>=28;current-=2){ctx.font=weight+' '+current+'px Lato';lines=wrap(ctx,text,1670);if(lines.length<=2)return {size:current,lines,weight}}return {size:28,lines,weight}}
async function draw(){const version=++drawVersion;await fonts();if(version!==drawVersion)return;const c=$('#preview'),ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.setTransform(c.width/1920,0,0,c.height/1080,0,0);const t=templates[state.template];ctx.fillStyle=t.background;ctx.fillRect(0,0,1920,1080);if(state.image){const r=Math.min(1920/state.image.width,1080/state.image.height),w=state.image.width*r,h=state.image.height*r;ctx.drawImage(state.image,(1920-w)/2,(1080-h)/2,w,h)}else{const g=ctx.createLinearGradient(0,0,1920,1080);g.addColorStop(0,t.background);g.addColorStop(1,state.template===1?'#e1e8f0':'#0b1e3b');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);ctx.fillStyle='#F05A22';ctx.fillRect(130,940,1660,3);ctx.font='400 27px Lato';ctx.textAlign='left';ctx.fillStyle=state.template===1?'#144E8C':'#ffffffaa';ctx.fillText(t.name+' · '+tr('PHÔI CHỜ BỔ SUNG','PLACEHOLDER BACKGROUND'),130,130)}
const name=fit(ctx,state.name,state.nameSize,900),role=fit(ctx,state.role,state.detailSize,400),unit=fit(ctx,state.unit,state.detailSize,400);const shared=Math.min(role.size,unit.size,name.size*.65);ctx.font='400 '+shared+'px Lato';role.size=unit.size=shared;role.lines=wrap(ctx,state.role,1670);unit.lines=wrap(ctx,state.unit,1670);const blocks=[name,role,unit].filter(b=>b.lines.length),height=blocks.reduce((n,b)=>n+b.lines.length*b.size*1.24,0)+Math.max(0,blocks.length-1)*22;let y=1080*state.position/100-height/2;state.overflow=height>700||y<180||y+height>910;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=state.colour;for(const b of blocks){ctx.font=b.weight+' '+b.size+'px Lato';for(const line of b.lines){ctx.fillText(line,960,y);y+=b.size*1.24}y+=22}$('#download-png').disabled=$('#download-pdf').disabled=state.busy||state.overflow||!fontReady;$('#message').classList.toggle('error',state.overflow||!fontReady);$('#message').textContent=!fontReady?tr('Chưa tải được font Lato. Kiểm tra thư mục assets/.','Could not load Lato. Check the assets/ folder.'):state.overflow?tr('Nội dung quá dài hoặc sát mép. Giảm cỡ/vị trí chữ trước khi xuất.','Text is too long or too close to an edge. Adjust the size or position before exporting.'):(state.image&&Math.abs(state.image.width/state.image.height-16/9)>.02)?tr('Phôi chưa đúng 16:9; ảnh đang được giữ nguyên tỷ lệ.','The background is not 16:9; its proportions are preserved.'):''}
let fontPromise;function fonts(){return fontPromise??=(async()=>{try{await Promise.all([document.fonts.load('400 52px Lato'),document.fonts.load('900 100px Lato')]);fontReady=document.fonts.check('400 52px Lato')&&document.fonts.check('900 100px Lato')}catch{fontReady=false}})()}
function safeName(s){return (s||'UEL_Bang-ten').normalize('NFC').replace(/[\u0000-\u001f\u202a-\u202e<>:"/\\|?*]/g,'').trim().slice(0,90)||'UEL_Bang-ten'}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
let pdfPromise;async function pdfLibrary(){if(window.PDFLib)return window.PDFLib;await (pdfPromise??=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='assets/pdf-lib.min.js';script.onload=resolve;script.onerror=()=>{pdfPromise=null;script.remove();reject(Error(tr('Không tải được thư viện PDF.','Could not load the PDF library.')))};document.head.append(script)}));return window.PDFLib}
async function printPng(blob){const bytes=new Uint8Array(await blob.arrayBuffer()),view=new DataView(bytes.buffer),chunk=new Uint8Array(21),cv=new DataView(chunk.buffer);cv.setUint32(0,9);chunk.set([112,72,89,115],4);cv.setUint32(8,11811);cv.setUint32(12,11811);chunk[16]=1;let crc=0xffffffff;for(const b of chunk.slice(4,17)){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}cv.setUint32(17,(crc^0xffffffff)>>>0);const parts=[bytes.slice(0,8)];for(let pos=8;pos+12<=bytes.length;){const len=view.getUint32(pos),end=pos+12+len,type=String.fromCharCode(...bytes.slice(pos+4,pos+8));if(end>bytes.length)throw Error('PNG error');if(type!=='pHYs')parts.push(bytes.slice(pos,end));if(type==='IHDR')parts.push(chunk);pos=end}return new Blob(parts,{type:'image/png'})}
async function exportFile(type){if(state.busy||state.overflow)return;state.busy=true;document.querySelectorAll('#controls input,#controls textarea,#controls select,#controls button,#language,#theme').forEach(n=>n.disabled=true);try{await draw();if(state.overflow)throw Error(tr('Cần điều chỉnh chữ trước khi xuất.','Adjust the text before exporting.'));if(!fontReady)throw Error(tr('Cần font Lato để xuất đúng kiểu chữ.','Lato is required for export.'));const c=$('#preview'),name=safeName('UEL_Bang-ten_'+state.name.replace(/\s+/g,'_'));if(type==='png'){const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error(tr('Không tạo được ảnh.','Could not create the image.'));download(await printPng(blob),name+'.png')}else{const lib=await pdfLibrary(),pdf=await lib.PDFDocument.create(),image=await pdf.embedPng(await (await new Promise(resolve=>c.toBlob(resolve,'image/png'))).arrayBuffer()),width=24/2.54*72,height=13.5/2.54*72;pdf.addPage([width,height]).drawImage(image,{x:0,y:0,width,height});download(new Blob([await pdf.save()],{type:'application/pdf'}),name+'.pdf')}$('#message').textContent=tr('Đã tạo file tải xuống.','Download ready.')}catch(error){$('#message').textContent=error.message;$('#message').classList.add('error')}finally{state.busy=false;document.querySelectorAll('#controls input,#controls textarea,#controls select,#controls button,#language,#theme').forEach(n=>n.disabled=false);$('#download-png').disabled=$('#download-pdf').disabled=state.overflow||!fontReady}}
document.addEventListener('input',e=>{const id=e.target.id;if(['name','role','unit'].includes(id))state[id]=e.target.value;else if(id==='text-colour')state.colour=e.target.value;else if(id==='name-size')state.nameSize=Number(e.target.value);else if(id==='detail-size')state.detailSize=Number(e.target.value);else if(id==='text-position')state.position=Number(e.target.value);else return;draw()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-template]');if(t){state.template=Number(t.dataset.template);loadTemplate()}if(e.target.id==='reset'){state.nameSize=100;state.detailSize=52;state.position=48;state.colour=templates[state.template].colour;render()}});
document.addEventListener('change',e=>{if(e.target.id!=='background-file')return;const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>10*1024*1024){$('#message').textContent=tr('Chọn PNG/JPG/WebP dưới 10 MB.','Choose PNG/JPG/WebP under 10 MB.');return}const version=++templateVersion,url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(version!==templateVersion)return;if(im.width*im.height>24000000){$('#message').textContent=tr('Phôi quá lớn; dùng ảnh dưới 24 triệu pixel.','Use a background under 24 megapixels.');return}state.image=im;temporaryImage=true;updateStatus();draw()};im.onerror=()=>{URL.revokeObjectURL(url);$('#message').textContent=tr('Không đọc được phôi.','Could not read the background.')};im.src=url});
$('#download-png').onclick=()=>exportFile('png');$('#download-pdf').onclick=()=>exportFile('pdf');$('#language').onclick=()=>{language=language==='vi'?'en':'vi';render()};$('#theme').onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';render()};render();loadTemplate();
</script></body></html>
