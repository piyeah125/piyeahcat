function btn(text,attrs='',primary=false){return `<button class="btn ${primary?'primary':''}" ${attrs}>${esc(text)}</button>`}
function link(text,url,primary=false){return url?`<a class="btn ${primary?'primary':''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)} ↗</a>`:''}
function copy(text,display){return btn(display||t('copy'),`data-copy="${esc(text)}"`)}
function media(file,name,ratio='16/9',logo=false){return `<div class="media ${logo?'logo':''}" style="aspect-ratio:${ratio}"><div class="placeholder"><b>${logo?'UEL':'◈'}</b><span>${esc(name)}</span><small>${esc(t('missing'))}</small><small>assets/${esc(file)}</small></div><img src="assets/${esc(file)}" alt="${esc(name)}" hidden></div>`}
function related(){return `<div class="note">${t('support')}<a href="#brand" data-page="brand">${t('logo')}</a> · <a href="#brand" data-page="brand">Roboto / Lora</a> · <a href="#brand" data-page="brand">${t('colours')}</a></div>`}
function card(o){return `<article class="card">${o.image?media(o.image,v(o.name)):''}<div class="pad"><h3>${esc(v(o.name))}</h3>${o.desc?`<p>${esc(v(o.desc))}</p>`:'<div style="height:14px"></div>'}${link(t('download'),o.url||L[o.link],true)}</div></article>`}
function heading(c){return `<div class="page-head"><div class="eyebrow">UEL / DESIGN RESOURCES</div><h1>${esc(c[lang==='vi'?1:2])}</h1><p>${esc(c[lang==='vi'?4:5])}</p></div>`}

/* Meow nhẹ: chỉ phát khi người dùng chủ động bấm mèo. */
let audioContext,lastMeow=0;
$('#mascot').onclick=async()=>{if(Date.now()-lastMeow<650)return;lastMeow=Date.now();try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext??=new AC();await audioContext.resume();const now=audioContext.currentTime,osc=audioContext.createOscillator(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(560,now);osc.frequency.exponentialRampToValueAtTime(830,now+.09);osc.frequency.exponentialRampToValueAtTime(300,now+.4);filter.type='bandpass';filter.Q.value=3;filter.frequency.setValueAtTime(1550,now);filter.frequency.exponentialRampToValueAtTime(650,now+.4);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.065,now+.055);gain.gain.exponentialRampToValueAtTime(.0001,now+.43);osc.connect(filter).connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+.45);osc.onended=()=>{osc.disconnect();filter.disconnect();gain.disconnect()}}catch{}};
/* Tuyết CSS: 16 hạt desktop / 9 hạt mobile, dừng khi ẩn tab hoặc reduced motion. */
function makeSnow(){const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;$('#snow').replaceChildren();if(reduced)return;for(let i=0;i<(matchMedia('(max-width:760px)').matches?9:16);i++){const flake=document.createElement('i');flake.className='snowflake';flake.style.cssText='left:'+((i*61.8)%100)+'%;animation-duration:'+(17+i%6*3)+'s;animation-delay:-'+(i*3.7)+'s;width:'+(i%3===0?5:3.5)+'px;height:'+(i%3===0?5:3.5)+'px';$('#snow').append(flake)}}makeSnow();matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change',makeSnow);document.addEventListener('visibilitychange',()=>document.documentElement.toggleAttribute('data-paused',document.hidden));

let unitState={width:'5',height:'3',unit:'m',dpi:'72'};
let timerRemaining=5*60*1000,timerDeadline=0,timerRunning=false,timerMinutes='5',timerInterval=0;
function renderTools(){const tabs=['colour','unit','timer'];$('#tools-body').innerHTML='<div class="tool-tabs" role="tablist">'+tabs.map(id=>'<button class="btn" id="tab-'+id+'" role="tab" data-tool-tab="'+id+'" aria-selected="'+(id===toolTab)+'" aria-controls="panel-'+id+'" tabindex="'+(id===toolTab?'0':'-1')+'">'+t(id==='colour'?'colourTool':id==='unit'?'unitTool':'timerTool')+'</button>').join('')+'</div><section class="tool-panel" role="tabpanel" id="panel-'+toolTab+'" aria-labelledby="tab-'+toolTab+'">'+(toolTab==='colour'?colourPanel():toolTab==='unit'?unitPanel():timerPanel())+'</section>';if(toolTab==='colour'){wireColour();if(pickedImage)drawImage()}if(toolTab==='unit')updateUnits();if(toolTab==='timer')updateTimerDisplay()}
function openTools(){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');syncSidebar();$('#quick-tools').showModal();renderTools();$('#tools-close').focus()}
$('#quick-tools').addEventListener('close',()=>{(matchMedia('(max-width:760px)').matches?$('#menu'):$('#tools-open')).focus()});$('#tools-open').onclick=openTools;$('#tools-close').onclick=()=>$('#quick-tools').close();$('#quick-tools').addEventListener('click',e=>{if(e.target===$('#quick-tools')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('#quick-tools').close()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-tool-tab]');if(b){toolTab=b.dataset.toolTab;renderTools();$('#tab-'+toolTab).focus()}const f=e.target.closest('[data-copy-format]');if(f){copyFormat=f.dataset.copyFormat;renderTools()}});
$('#tools-body').addEventListener('keydown',e=>{if(!e.target.matches('[role=tab]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['colour','unit','timer'],i=ids.indexOf(toolTab);toolTab=ids[e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3];renderTools();$('#tab-'+toolTab).focus()});
function colourPanel(){return '<div id="dropzone" class="dropzone"><p>'+t('drop')+'</p><button class="btn" id="choose-image">'+t('chooseImage')+'</button><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><small>PNG · JPG · WebP · GIF / 25 MB</small><small>'+t('uploadNote')+'</small></div><div class="row space" style="margin-top:14px"><small class="tool-meta">'+t('copyAs')+'</small><div class="row"><button class="filter-chip" data-copy-format="hex" aria-pressed="'+(copyFormat==='hex')+'">HEX</button><button class="filter-chip" data-copy-format="rgb" aria-pressed="'+(copyFormat==='rgb')+'">RGB</button></div></div><p class="tool-meta" style="margin-top:12px">'+t('pickHint')+'</p><div id="image-stage" class="image-stage" '+(pickedImage?'':'hidden')+'><canvas id="picker-canvas" tabindex="0" aria-label="'+t('colourTool')+'"></canvas></div><div id="colour-result"></div><div class="tool-meta" id="image-meta">'+esc(imageName)+'</div><p class="tool-error" id="image-error" role="status"></p>'}
function wireColour(){const zone=$('#dropzone'),input=$('#image-file');$('#choose-image').onclick=()=>input.click();input.onchange=()=>{if(input.files[0])loadImage(input.files[0])};['dragenter','dragover'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.add('dragover')}));['dragleave','drop'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.remove('dragover')}));zone.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadImage(f)});$('#picker-canvas').onclick=e=>{const canvas=e.currentTarget,r=canvas.getBoundingClientRect();samplePixel(Math.min(canvas.width-1,Math.max(0,Math.floor((e.clientX-r.left)*canvas.width/r.width))),Math.min(canvas.height-1,Math.max(0,Math.floor((e.clientY-r.top)*canvas.height/r.height))))};$('#picker-canvas').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const c=e.currentTarget;samplePixel(Math.floor(c.width/2),Math.floor(c.height/2))}};showColour()}
let imageLoadVersion=0;
function loadImage(file){const version=++imageLoadVersion;if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)||file.size>25*1024*1024){$('#image-error').textContent=t('badImage');return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(version!==imageLoadVersion)return;if(im.naturalWidth*im.naturalHeight>36000000||!im.naturalWidth){if($('#image-error'))$('#image-error').textContent=t('badImage');return}pickedImage=im;imageName=file.name+' · '+im.naturalWidth+' × '+im.naturalHeight+' px';pickedHex='';pickedRgb='';if(toolTab==='colour'&&$('#quick-tools').open)renderTools()};im.onerror=()=>{URL.revokeObjectURL(url);if(version===imageLoadVersion&&$('#image-error'))$('#image-error').textContent=t('badImage')};im.src=url}
function drawImage(){const c=$('#picker-canvas');if(!c||!pickedImage)return;c.width=pickedImage.naturalWidth;c.height=pickedImage.naturalHeight;c.getContext('2d',{willReadFrequently:true}).drawImage(pickedImage,0,0);$('#image-stage').hidden=false;$('#image-meta').textContent=imageName}
function samplePixel(x,y){const c=$('#picker-canvas');if(!c||!pickedImage)return;const data=c.getContext('2d',{willReadFrequently:true}).getImageData(x,y,1,1).data;if(data[3]===0){toast(t('transparent'));return}pickedHex='#'+[...data].slice(0,3).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();pickedRgb='rgb('+[...data].slice(0,3).join(', ')+')';pickedAlpha=data[3];showColour();clipboard(copyFormat==='hex'?pickedHex:pickedRgb)}
function showColour(){if(!$('#colour-result'))return;$('#colour-result').innerHTML=pickedHex?'<div class="colour-result"><span class="colour-chip" style="background:'+pickedHex+'"></span>'+copy(pickedHex,pickedHex)+copy(pickedRgb,pickedRgb)+(pickedAlpha<255?'<small class="tool-meta">'+t('alpha')+': '+Math.round(pickedAlpha/255*100)+'%</small>':'')+'</div>':''}
function unitPanel(){return '<div class="row">'+btn(t('screenDpi'),'data-dpi="72"')+btn(t('printDpi'),'data-dpi="300"')+'</div><div class="unit-grid"><label>'+t('width')+'<input id="unit-width" type="number" min="0.001" step="any" value="'+unitState.width+'"></label><label>'+t('height')+'<input id="unit-height" type="number" min="0.001" step="any" value="'+unitState.height+'"></label><label>'+t('unit')+'<select id="unit-name"><option value="cm" '+(unitState.unit==='cm'?'selected':'')+'>cm</option><option value="m" '+(unitState.unit==='m'?'selected':'')+'>m</option><option value="px" '+(unitState.unit==='px'?'selected':'')+'>px</option></select></label><label>DPI<input id="unit-dpi" type="number" min="1" max="2400" step="any" value="'+unitState.dpi+'"></label></div><div id="unit-result" class="unit-output" role="status"></div><div class="row" id="unit-copy"></div><p class="tool-meta" style="margin-top:17px">'+t('unitNote')+'</p><p class="tool-meta" style="margin-top:7px">'+t('ledDpiNote')+'</p>'}
function conversion(w,h,unit,dpi){if(![w,h,dpi].every(Number.isFinite)||w<=0||h<=0||dpi<1||dpi>2400||Math.max(w,h)>1e9)return null;if(unit==='px')return {cm:[w/dpi*2.54,h/dpi*2.54],m:[w/dpi*.0254,h/dpi*.0254]};return {px:[Math.max(1,Math.round(w*(unit==='m'?100:1)/2.54*dpi)),Math.max(1,Math.round(h*(unit==='m'?100:1)/2.54*dpi))]}}
function updateUnits(){if(!$('#unit-result'))return;const r=conversion(Number(unitState.width),Number(unitState.height),unitState.unit,Number(unitState.dpi));if(!r){$('#unit-result').innerHTML='<p class="tool-error">'+t('invalidUnit')+'</p>';$('#unit-copy').innerHTML='';return}const fmt=n=>String(Number(n.toFixed(4))),text=r.px?r.px.join(' × ')+' px':r.cm.map(fmt).join(' × ')+' cm',extra=r.m?r.m.map(fmt).join(' × ')+' m':unitState.width+' × '+unitState.height+' '+unitState.unit+' / '+unitState.dpi+' DPI';$('#unit-result').innerHTML='<strong>'+text+'</strong><small>'+extra+'</small>';$('#unit-copy').innerHTML=copy(text,t('copySize'))+(r.m?copy(extra,extra):'')}
document.addEventListener('input',e=>{const ids={'unit-width':'width','unit-height':'height','unit-dpi':'dpi'};if(ids[e.target.id]){unitState[ids[e.target.id]]=e.target.value;updateUnits()}if(e.target.id==='timer-minutes'){timerMinutes=e.target.value;if(!timerRunning){timerRemaining=Math.max(0,Number(timerMinutes)||0)*60000;updateTimerDisplay()}}});document.addEventListener('change',e=>{if(e.target.id==='unit-name'){unitState.unit=e.target.value;updateUnits()}});document.addEventListener('click',e=>{const b=e.target.closest('[data-dpi]');if(b){unitState.dpi=b.dataset.dpi;$('#unit-dpi').value=unitState.dpi;updateUnits()}});
function timerPanel(){return '<label class="timer-setting">'+t('minutes')+'<input type="number" id="timer-minutes" min="0.01" max="180" step="any" value="'+esc(timerMinutes)+'" '+(timerRunning?'disabled':'')+'></label><div class="timer-display" id="timer-display" role="timer"></div><div class="row"><button class="btn primary" id="timer-start">'+t(timerRunning?'pause':'start')+'</button><button class="btn" id="timer-reset">'+t('reset')+'</button></div><p class="tool-error" id="timer-error" role="status"></p>'}
function updateTimerDisplay(){if(!$('#timer-display'))return;const n=Math.max(0,Math.ceil((timerRunning?timerDeadline-Date.now():timerRemaining)/1000));$('#timer-display').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timerTick(){if(timerRunning&&Date.now()>=timerDeadline){timerRemaining=0;timerRunning=false;clearInterval(timerInterval);toast(t('timerDone'));if($('#quick-tools').open&&toolTab==='timer')renderTools()}updateTimerDisplay()}
document.addEventListener('click',e=>{if(e.target.closest('#timer-start')){if(timerRunning){timerRemaining=Math.max(0,timerDeadline-Date.now());timerRunning=false;clearInterval(timerInterval)}else{if(!Number.isFinite(Number(timerMinutes))||Number(timerMinutes)<.01||Number(timerMinutes)>180){$('#timer-error').textContent=t('timerInvalid');return}if(timerRemaining<=0)timerRemaining=Number(timerMinutes)*60000;timerDeadline=Date.now()+timerRemaining;timerRunning=true;clearInterval(timerInterval);timerInterval=setInterval(timerTick,250)}renderTools()}if(e.target.closest('#timer-reset')){clearInterval(timerInterval);timerRunning=false;timerRemaining=Math.max(0,Number(timerMinutes)||0)*60000;renderTools()}});

/* Mascot: ưu tiên GIF do bạn cung cấp, luôn có mèo SVG dự phòng. */
$('#mascot').innerHTML=`<div class="fallback-cat">${catSVG}</div><img class="mascot-image" src="assets/meo-tro-ly.gif" alt="Con mèo của Pí Yeah" hidden>`;const mi=$('#mascot img');mi.onload=()=>{mi.hidden=false;$('#mascot .fallback-cat').hidden=true};let remoteCatTried=false;mi.onerror=()=>{if(!remoteCatTried){remoteCatTried=true;mi.src=L.mascotGif}else{mi.hidden=true;$('#mascot .fallback-cat').hidden=false}};if(mi.complete){if(mi.naturalWidth)mi.onload();else mi.onerror()}
/* Con trỏ: vòng nội suy nhanh, chỉ chạy khi có chuột và cho phép chuyển động. */
let cursorFrame=0;const cursorMedia=matchMedia('(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference)'),dot=$('.dot'),ring=$('.ring');let mx=-100,my=-100,rx=mx,ry=my,seen=false;function cursorTick(){rx+=(mx-rx)*.26;ry+=(my-ry)*.26;dot.style.transform=`translate(${mx-4}px,${my-4}px)`;ring.style.transform=`translate(${rx-ring.offsetWidth/2}px,${ry-ring.offsetHeight/2}px)`;cursorFrame=requestAnimationFrame(cursorTick)}function syncCursor(){cancelAnimationFrame(cursorFrame);dot.style.display=ring.style.display='none';if(cursorMedia.matches&&seen){dot.style.display=ring.style.display='block';cursorTick()}}document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mx=e.clientX;my=e.clientY;if(!seen){seen=true;rx=mx;ry=my;syncCursor()}ring.classList.toggle('hover',!!e.target.closest('button,a,input,textarea'))},{passive:true});document.documentElement.addEventListener('pointerleave',()=>{seen=false;syncCursor()});cursorMedia.addEventListener('change',syncCursor);
render();
</script></body></html>
