function btn(text,attrs='',primary=false){return `<button class="btn ${primary?'primary':''}" ${attrs}>${esc(text)}</button>`}
function link(text,url,primary=false){return url?`<a class="btn ${primary?'primary':''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)} ↗</a>`:''}
function copy(text,display){return btn(display||t('copy'),`data-copy="${esc(text)}"`)}
function media(file,name,ratio='16/9',logo=false){return `<div class="media ${logo?'logo':''}" style="aspect-ratio:${ratio}"><div class="placeholder"><b>${logo?'UEL':'◈'}</b><span>${esc(name)}</span><small>${esc(t('missing'))}</small><small>assets/${esc(file)}</small></div><img src="assets/${esc(file)}" alt="${esc(name)}" hidden></div>`}
function related(){return `<div class="note">${t('support')}<a href="#brand" data-page="brand">${t('logo')}</a> · <a href="#brand" data-page="brand">Roboto / Lora</a> · <a href="#brand" data-page="brand">${t('colours')}</a></div>`}
function card(o){return `<article class="card">${o.image?media(o.image,v(o.name)):''}<div class="pad"><h3>${esc(v(o.name))}</h3>${o.desc?`<p>${esc(v(o.desc))}</p>`:'<div style="height:14px"></div>'}${link(t('download'),o.url||L[o.link],true)}</div></article>`}
function heading(c){return `<div class="page-head"><div class="eyebrow">UEL / DESIGN RESOURCES</div><h1>${esc(c[lang==='vi'?1:2])}</h1><p>${esc(c[lang==='vi'?4:5])}</p></div>`}
function home(){return `<section class="hero"><div><div class="eyebrow">${t('hello')}</div><h1 style="margin-top:16px">${t('hero1')}<br><span class="gradient">${t('hero2')}</span></h1><p>${t('heroDesc')}</p><div class="row">${btn(t('explore')+' ↗','data-page="sizes"',true)}${btn(t('identity'),'data-page="brand"')}</div></div><div class="hero-art"><div class="orbit"></div>${catSVG}<span class="float-tag one">◈ UEL BRAND ASSETS</span><span class="float-tag two">✦ MADE FOR YOUR WORK</span></div></section><div class="overview-stats"><div class="card stat"><strong class="gradient">${C.length}</strong><small>${t('categories')}</small></div><div class="card stat"><strong class="gradient">24/7</strong><small>${t('available')}</small></div><div class="card stat"><strong class="gradient">100%</strong><small>${t('free')}</small></div></div><div class="section-head row space"><div><h2>${t('quick')}</h2><p style="font-size:13px;margin-top:4px">${t('quickDesc')}</p></div><span class="tag">QUICK ACCESS</span></div><div class="grid">${C.map(c=>`<button class="card quick-card" data-page="${c[0]}"><span class="quick-icon">${c[3]}</span><h3>${c[lang==='vi'?1:2]}<span>↗</span></h3><p>${c[lang==='vi'?4:5]}</p></button>`).join('')}</div>`}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function dimensions(){return '<div class="note">'+t('widthHeight')+'</div>'+D.sizes.map(s=>{const groups=new Map();s.rows.forEach(r=>{const key=[r[2],r[3],r[4],r[5]||''].join('|');if(!groups.has(key))groups.set(key,{r,names:[]});groups.get(key).names.push(r[lang==='vi'?0:1])});return '<section><h2 class="section-head">'+v(s.title)+'</h2><div class="table-wrap"><table><thead><tr><th>'+t('name')+'</th><th>'+t('size')+'</th><th>'+t('ratio')+'</th></tr></thead><tbody>'+[...groups.values()].map(({r,names})=>{const a=Math.round(r[2]*100),b=Math.round(r[3]*100),g=gcd(a,b),size=r[5]?label(r[5]):r[2]+' × '+r[3]+' '+r[4];return '<tr><td>'+esc(names.join(' / '))+'</td><td>'+copy(size,size)+'</td><td>'+a/g+':'+b/g+'</td></tr>'}).join('')+'</tbody></table></div></section>'}).join('')}

function render(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;$('#nav').innerHTML=C.map((c,i)=>`<button data-page="${c[0]}" class="${page===c[0]?'active':''}" ${page===c[0]?'aria-current="page"':''}><span aria-hidden="true">${c[3]}</span><span>${c[lang==='vi'?1:2]}</span><small>${String(i+1).padStart(2,'0')}</small></button>`).join('');$('#nav-label').textContent=t('library');$('#assistant-label').textContent=t('online');$('#sidebar-text').textContent=t('side');$('#search').placeholder=t('search');$('#search-label').textContent=t('searchLabel');$('#language').innerHTML=ICON.globe+(lang==='vi'?'VIE':'ENG');$('#language').setAttribute('aria-label',lang==='vi'?'Switch to English':'Chuyển sang tiếng Việt');$('#theme').innerHTML=(theme==='dark'?ICON.moon:ICON.sun)+'<span class="theme-label">'+t(theme==='dark'?'darkShort':'lightShort')+'</span>';$('#theme').setAttribute('aria-label',t(theme==='dark'?'light':'dark'));$('#menu').setAttribute('aria-label',t('menu'));$('#visit').innerHTML=ICON.paw+'<span class="visit-label">'+t('visit')+'</span>';$('#visit').setAttribute('aria-label',t('visit'));$('#visit').title=t('visit');$('#tools-open').innerHTML='<span class="tool-emblem">'+ICON.tools+'</span><span><strong>'+t('tools')+'</strong><small>'+v(P('QR · Ảnh · PDF & hơn nữa','QR · Images · PDF & more'))+'</small></span><span class="tools-arrow">↗</span>';$('#tools-open').setAttribute('aria-label',t('tools'));$('#tools-open').title=t('tools');$('#tools-title').textContent=t('tools');$('#tools-close').setAttribute('aria-label',t('close'));$('#mascot').setAttribute('aria-label',t('meow'));$('#mascot').title=t('meow');syncCatToggle();$('#visit').href=L.visit;$('#speech').innerHTML=lang==='vi'?'Khỏi hỏi con Pí rảnh 0?<br>Vì nó luôn 0 rảnh!':'Is Pí free?<br>Pí is always busy!';$('#footer-brand').innerHTML='<strong>Con mèo của Pí Yeah</strong><span class="footer-extra"> · '+v(P('Làm việc nhẹ hơn một chút.','Make work a little lighter.'))+'</span>';$ function batchPanel(){const l=imageLimits();return uploader('batch-files','image/png,image/jpeg,image/webp',B('Kéo ảnh JPG, PNG hoặc WebP vào đây','Drop JPG, PNG or WebP images here'),true,B('Tối đa '+l.count+' ảnh · '+l.each+' MB/ảnh · Tổng '+l.total+' MB','Up to '+l.count+' images · '+l.each+' MB each · '+l.total+' MB total'))+'<div class="tool-section tool-fields"><fieldset id="batch-settings" style="border:0;padding:0;margin:0;min-width:0" '+(batchState.busy?'disabled':'')+'><div class="tool-fields"><div class="tool-two">'+toolField(B('Chế độ','Mode'),'<select id="batch-mode">'+toolOptions([['convert',B('Nén / đổi ảnh','Compress / convert')],['rename',B('Chỉ đổi tên','Rename only')]],batchState.mode)+'</select>')+toolField(B('Định dạng','Format'),'<select id="batch-format" '+(batchState.mode==='rename'?'disabled':'')+'>'+toolOptions([['webp','WebP'],['jpeg','JPG'],['png','PNG'],['original',B('Giữ định dạng','Keep format')]],batchState.format)+'</select>')+'</div><div id="batch-convert-settings" '+(batchState.mode==='rename'?'hidden':'')+'><div class="tool-two">'+toolField(B('Rộng tối đa (px)','Maximum width (px)'),toolInput('batch-width',batchState.width,'type="number" min="1" max="'+l.maxSide+'" placeholder="'+B('Giữ nguyên','Keep original')+'"'))+toolField(B('Cao tối đa (px)','Maximum height (px)'),toolInput('batch-height',batchState.height,'type="number" min="1" max="'+l.maxSide+'" placeholder="'+B('Giữ nguyên','Keep original')+'"'))+'</div><p class="tool-caption" style="margin-top:8px">'+B('Giữ tỷ lệ, không phóng lớn ảnh nhỏ. Giới hạn cạnh '+l.maxSide+' px.','Preserves proportions without enlarging small images. Maximum side: '+l.maxSide+' px.')+'</p><div class="tool-two" style="margin-top:13px">'+toolField(B('Chất lượng JPG/WebP','JPG/WebP quality'),'<input id="batch-quality" type="range" min="0.2" max="1" step="0.05" value="'+batchState.quality+'" '+(batchState.format==='png'?'disabled':'')+'><small id="batch-quality-label">'+Math.round(batchState.quality*100)+'%</small>')+toolField(B('Nền khi xuất JPG','JPG background'),toolInput('batch-background',batchState.background,'type="color"'))+'</div><p class="tool-caption">'+B('PNG giữ độ trong suốt; thanh chất lượng không áp dụng cho PNG.','PNG preserves transparency; the quality slider does not apply to PNG.')+'</p></div><label class="check-line"><input id="batch-rename" type="checkbox" '+(batchState.rename||batchState.mode==='rename'?'checked':'')+' '+(batchState.mode==='rename'?'disabled':'')+'>'+B('Đặt tên và đánh số','Rename and number files')+'</label><div class="tool-two">'+toolField(B('Tiền tố tên file','File name prefix'),toolInput('batch-prefix',batchState.prefix,'maxlength="70" placeholder="UEL"'))+'<div class="tool-two">'+toolField(B('Bắt đầu','Start at'),toolInput('batch-start',batchState.start,'type="number" min="1" max="999999"'))+toolField(B('Số chữ số','Digits'),'<select id="batch-padding">'+toolOptions([['1','1'],['2','01'],['3','001'],['4','0001']],batchState.padding)+'</select>')+'</div></div></div></fieldset></div><div id="batch-list" class="tool-file-list"></div><progress id="batch-progress" class="tool-progress" max="100" value="'+batchState.progress+'" aria-label="'+B('Tiến độ xử lý ảnh','Image processing progress')+'"></progress><p class="tool-state '+(batchState.error?'error':'')+'" id="batch-status" role="status">'+esc(batchState.message)+'</p><div class="tool-action-bar"><button class="btn primary" id="batch-process" '+(batchState.busy||!batchState.files.length?'disabled':'')+'>'+B('Xử lý ảnh','Process images')+'</button><button class="btn" id="batch-download" '+(batchState.busy||!batchState.outputs.length?'disabled':'')+'>'+B('Tải tất cả · ZIP','Download all · ZIP')+' ↓</button><button class="btn" id="batch-cancel" '+(!batchState.busy?'hidden':'')+'>'+B('Hủy','Cancel')+'</button><button class="btn" id="batch-clear" '+(batchState.busy?'disabled':'')+'>'+B('Xóa danh sách','Clear list')+'</button></div>'}
function batchExt(file){if(batchState.mode==='rename'||batchState.format==='original')return file.name.split('.').pop().toLowerCase();return batchState.format==='jpeg'?'jpg':batchState.format}
function batchOutputName(item,index){const rename=batchState.mode==='rename'||batchState.rename;const prefix=safeFileName(batchState.prefix,'UEL');const number=Number(batchState.start)+index;return rename?prefix+'_'+String(number).padStart(Number(batchState.padding),'0')+'.'+batchExt(item.file):safeFileName(stripExtension(item.file.name),'UEL_'+(index+1))+'.'+batchExt(item.file)}
function batchList(){if(!$('#batch-list'))return;$('#batch-list').innerHTML=batchState.files.map((item,i)=>'<div class="tool-file-row"><div><strong>'+esc(item.file.name)+'</strong><small class="batch-plan">→ '+esc(batchOutputName(item,i))+' · '+mb(item.file.size)+(item.result?' · '+esc(item.result):'')+'</small></div><button data-batch-remove="'+item.id+'" aria-label="'+B('Bỏ ảnh','Remove image')+'" '+(batchState.busy?'disabled':'')+'>×</button></div>').join('');if($('#batch-process'))$('#batch-process').disabled=batchState.busy||!batchState.files.length}
function mountBatch(){bindToolDrop($('#batch-files-drop'),$('#batch-files'),addBatchFiles);batchList();document.querySelectorAll('#batch-files-drop button').forEach(b=>b.disabled=batchState.busy)}
function batchStatus(message,error=false){batchState.message=message;batchState.error=error;toolMessage('#batch-status',message,error)}
function invalidateBatch(){const hadOutput=batchState.outputs.length>0;batchState.outputs=[];batchState.progress=0;batchState.files.forEach(item=>item.result='');if($('#batch-progress'))$('#batch-progress').value=0;if($('#batch-download'))$('#batch-download').disabled=true;if(hadOutput)batchStatus(B('Thông số đã đổi. Bấm Xử lý ảnh để tạo lại.','Settings changed. Process the images again.'));batchList()}
function addBatchFiles(files){if(batchState.busy)return;const l=imageLimits(),all=batchState.files.map(x=>x.file),seen=new Set(all.map(f=>f.name+'|'+f.size+'|'+f.lastModified)),fresh=[];for(const file of files){if(!/^image\/(png|jpeg|webp)$/.test(file.type)){batchStatus(B('Chỉ nhận JPG, PNG và WebP.','Only JPG, PNG and WebP are supported.'),true);return}if(file.size>l.each*1048576){batchStatus(B('Mỗi ảnh tối đa '+l.each+' MB.','Each image must be under '+l.each+' MB.'),true);return}const key=file.name+'|'+file.size+'|'+file.lastModified;if(!seen.has(key)){seen.add(key);fresh.push(file)}}if(all.length+fresh.length>l.count||[...all,...fresh].reduce((n,f)=>n+f.size,0)>l.total*1048576){batchStatus(B('Vượt giới hạn '+l.count+' ảnh hoặc tổng '+l.total+' MB.','Limit exceeded: '+l.count+' images or '+l.total+' MB total.'),true);return}batchState.files.push(...fresh.map(file=>({id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),file,result:''})));invalidateBatch();batchStatus(B('Đã chọn '+batchState.files.length+' ảnh.','Selected '+batchState.files.length+' images.'));batchList()}
async function rasterSize(file){const a=new Uint8Array(await file.slice(0,262144).arrayBuffer()),d=new DataView(a.buffer);if(a.length>=24&&a[0]===137&&a[1]===80&&a[2]===78&&a[3]===71)return {width:d.getUint32(16),height:d.getUint32(20)};if(a[0]===255&&a[1]===216){let p=2;while(p+8<a.length){if(a[p]!==255){p++;continue}const marker=a[p+1];p+=2;if(marker===216||marker===217)continue;const len=d.getUint16(p);if(len<2)break;if([192,193,194,195,197,198,199,201,202,203,205,206,207].includes(marker))return {height:d.getUint16(p+3),width:d.getUint16(p+5)};p+=len}}if(a.length>=30&&String.fromCharCode(...a.slice(0,4))==='RIFF'&&String.fromCharCode(...a.slice(8,12))==='WEBP'){const kind=String.fromCharCode(...a.slice(12,16));if(kind==='VP8X')return {width:1+a[24]+(a[25]<<8)+(a[26]<<16),height:1+a[27]+(a[28]<<8)+(a[29]<<16)};if(kind==='VP8 ')return {width:d.getUint16(26,true)&16383,height:d.getUint16(28,true)&16383};if(kind==='VP8L'){const bits=d.getUint32(21,true);return {width:1+(bits&16383),height:1+((bits>>>14)&16383)}}}throw Error(B('Không đọc được kích thước ảnh.','Could not read the image dimensions.'))}
async function bitmapFor(file){if(window.createImageBitmap)return createImageBitmap(file);const url=URL.createObjectURL(file);return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(Error(B('Không giải mã được ảnh.','Could not decode the image.')))};image.src=url})}
function validateBatchSettings(){const l=imageLimits();if(batchState.files.length>l.count||batchState.files.some(item=>item.file.size>l.each*1048576)||batchState.files.reduce((n,item)=>n+item.file.size,0)>l.total*1048576)return B('Danh sách vượt giới hạn thiết bị hiện tại. Bỏ bớt ảnh hoặc dùng máy tính.','The list exceeds the current device limits. Remove images or use a desktop.');if((batchState.mode==='rename'||batchState.rename)&&(!Number.isInteger(Number(batchState.start))||Number(batchState.start)<1||Number(batchState.start)>999999))return B('Số bắt đầu phải từ 1 đến 999999.','The starting number must be between 1 and 999999.');if(batchState.mode!=='rename')for(const value of [batchState.width,batchState.height])if(value!==''&&(!Number.isFinite(Number(value))||Number(value)<1||Number(value)>l.maxSide))return B('Kích thước phải từ 1 đến '+l.maxSide+' px.','Dimensions must be between 1 and '+l.maxSide+' px.');return ''}
async function processBatch(){if(batchState.busy||!batchState.files.length)return;const invalid=validateBatchSettings();if(invalid){batchStatus(invalid,true);return}const token=++batchState.token,l=imageLimits();batchState.busy=true;batchState.progress=0;batchState.outputs=[];batchState.files.forEach(f=>f.result='');renderTools();let failures=0,total=0;const usedNames=new Set();for(let i=0;i<batchState.files.length;i++){if(token!==batchState.token)break;const item=batchState.files[i];try{let blob=item.file;if(batchState.mode!=='rename'){const dimensions=await rasterSize(item.file);if(dimensions.width<1||dimensions.height<1||dimensions.width*dimensions.height>l.pixels)throw Error(B('Ảnh vượt '+l.pixels/1000000+' triệu pixel.','Image exceeds '+l.pixels/1000000+' megapixels.'));const bitmap=await bitmapFor(item.file);try{const scale=Math.min(1,(Number(batchState.width)||bitmap.width)/bitmap.width,(Number(batchState.height)||bitmap.height)/bitmap.height,l.maxSide/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=c.getContext('2d');const mime=batchState.format==='original'?item.file.type:'image/'+batchState.format;if(mime==='image/jpeg'){ctx.fillStyle=batchState.background;ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(bitmap,0,0,c.width,c.height);blob=await new Promise(resolve=>c.toBlob(resolve,mime,batchState.quality));if(!blob||blob.type!==mime)throw Error(B('Trình duyệt chưa hỗ trợ định dạng này. Chọn PNG/JPG.','This format is not supported here. Choose PNG/JPG.'));item.result=c.width+' × '+c.height+' px · '+mb(blob.size);c.width=c.height=1}finally{bitmap.close?.()}}else item.result=B('Giữ nguyên nội dung · ','Original content · ')+mb(blob.size);if(token!==batchState.token)break;if(total+blob.size>l.total*1048576)throw Error(B('Tổng file xuất vượt '+l.total+' MB; giảm kích thước/chất lượng.','Output exceeds '+l.total+' MB; reduce dimensions or quality.'));let name=batchOutputName(item,i),base=stripExtension(name),ext=name.split('.').pop(),suffix=2;while(usedNames.has(name.toLowerCase()))name=base+'_'+suffix+++'.'+ext;usedNames.add(name.toLowerCase());batchState.outputs.push({name,bytes:new Uint8Array(await blob.arrayBuffer())});total+=blob.size}catch(error){failures++;item.result=B('Lỗi: ','Error: ')+(error.message||String(error))}batchState.progress=Math.round((i+1)/batchState.files.length*100);if($('#batch-progress'))$('#batch-progress').value=batchState.progress;batchStatus(B('Đang xử lý ','Processing ')+(i+1)+'/'+batchState.files.length);batchList();await nextPaint()}
if(token!==batchState.token){batchState.outputs=[];batchStatus(B('Đã hủy. Có thể chỉnh thông số và chạy lại.','Cancelled. Adjust the settings and try again.'))}else batchStatus(B('Xong '+batchState.outputs.length+'/'+batchState.files.length+' ảnh.','Processed '+batchState.outputs.length+'/'+batchState.files.length+' images.')+(failures?B(' Có '+failures+' ảnh lỗi; xem danh sách.',' '+failures+' failed; see the list.'):'')+' '+mb(total),!!failures);batchState.busy=false;if(toolTab==='images'&&$('#quick-tools').open)renderTools()}
async function downloadBatch(){if(batchState.busy||!batchState.outputs.length)return;const button=$('#batch-download');if(button)button.disabled=true;try{const zip=await loadToolLibrary('zip'),files=Object.fromEntries(batchState.outputs.map(r=>[r.name,r.bytes]));await nextPaint();saveToolBlob(new Blob([zip.zipSync(files,{level:0})],{type:'application/zip'}),'UEL_Anh.zip');toast(B('Đã tạo ZIP.','ZIP download ready.'))}catch(error){batchStatus(error.message,true)}finally{if($('#batch-download'))$('#batch-download').disabled=false}}
document.addEventListener('input',e=>{const map={'batch-width':'width','batch-height':'height','batch-prefix':'prefix','batch-start':'start','batch-background':'background','batch-quality':'quality'};if(map[e.target.id]&&!batchState.busy){batchState[map[e.target.id]]=e.target.value;if(e.target.id==='batch-quality')$('#batch-quality-label').textContent=Math.round(Number(e.target.value)*100)+'%';invalidateBatch()}});
document.addEventListener('change',e=>{if(batchState.busy)return;if(e.target.id==='batch-mode'){batchState.mode=e.target.value;invalidateBatch();renderTools()}if(e.target.id==='batch-format'){batchState.format=e.target.value;invalidateBatch();renderTools()}if(e.target.id==='batch-rename'){batchState.rename=e.target.checked;invalidateBatch()}if(e.target.id==='batch-padding'){batchState.padding=e.target.value;invalidateBatch()}});
document.addEventListener('click',e=>{if(e.target.closest('#batch-process'))processBatch();if(e.target.closest('#batch-download'))downloadBatch();if(e.target.closest('#batch-cancel'))batchState.token++;if(e.target.closest('#batch-clear')&&!batchState.busy){batchState.files=[];batchState.outputs=[];batchState.progress=0;batchState.message='';renderTools()}const remove=e.target.closest('[data-batch-remove]');if(remove&&!batchState.busy){batchState.files=batchState.files.filter(f=>f.id!==remove.dataset.batchRemove);invalidateBatch();batchStatus('')}});

const pdfState={documents:[],pages:[],busy:false,token:0,page:0,filename:'UEL_Tai-lieu',message:'',error:false,previewWarning:false,errors:[]};
let pdfSerial=0,pdfObserver=null,pdfModulePromise=null,pdfSharedWorker=null;
const pdfRenderTasks=new Set(),pdfThumbs=new Map();
function pdfLimits(){return matchMedia('(max-width:760px)').matches?{files:5,bytes:20*1048576,pages:50,output:40*1048576}:{files:10,bytes:50*1048576,pages:100,output:100*1048576}}
function pdfPanel(){const l=pdfLimits();return uploader('pdf-files','.pdf,application/pdf',B('Kéo một hoặc nhiều PDF vào đây','Drop one or more PDF files here'),true,B('Tối đa '+l.files+' file · '+l.bytes/1048576+' MB · '+l.pages+' trang','Up to '+l.files+' files · '+l.bytes/1048576+' MB · '+l.pages+' pages'))+'<p class="tool-caption" style="margin-top:12px">'+B('Chọn trang để xuất. Kéo thả hoặc dùng ↑ ↓ để đổi thứ tự. File có mật khẩu chưa được hỗ trợ.','Select pages to export. Drag or use ↑ ↓ to reorder. Password-protected files are not supported.')+'</p><div class="tool-action-bar tool-section"><button class="btn" id="pdf-all" '+(pdfState.busy?'disabled':'')+'>'+B('Chọn tất cả','Select all')+'</button><button class="btn" id="pdf-none" '+(pdfState.busy?'disabled':'')+'>'+B('Bỏ chọn','Deselect all')+'</button><button class="btn" id="pdf-restore" '+(pdfState.busy?'disabled':'')+'>'+B('Khôi phục tất cả','Restore all')+'</button><button class="btn" id="pdf-clear" '+(pdfState.busy?'disabled':'')+'>'+B('Xóa danh sách','Clear list')+'</button></div><p class="tool-state '+(pdfState.error?'error':'')+'" id="pdf-status" role="status">'+esc(pdfState.message)+'</p><div id="pdf-summary" class="tool-caption"></div><div id="pdf-pages" class="pdf-pages"></div><div id="pdf-pagination" class="pdf-pagination"></div><div class="tool-section tool-fields"><div class="tool-two">'+toolField(B('Tên file xuất','Output file name'),toolInput('pdf-filename',pdfState.filename,'maxlength="90"'))+'<div class="tool-action-bar" style="align-self:end"><button class="btn primary" id="pdf-merge" '+(pdfState.busy||!pdfState.pages.some(p=>p.selected)?'disabled':'')+'>'+B('Gộp / Xuất PDF','Merge / Export PDF')+' ↓</button><button class="btn" id="pdf-split" '+(pdfState.busy||!pdfState.pages.some(p=>p.selected)?'disabled':'')+'>'+B('Tách trang · ZIP','Split pages · ZIP')+' ↓</button></div></div></div>'}
function pdfStatus(message,error=false){pdfState.message=message;pdfState.error=error;toolMessage('#pdf-status',message,error)}
async function pdfRenderer(){if(!pdfModulePromise)pdfModulePromise=import(new URL('assets/pdf.min.mjs',document.baseURI).href).then(module=>{module.GlobalWorkerOptions.workerSrc=new URL('assets/pdf.worker.min.mjs',document.baseURI).href;return module}).catch(error=>{pdfModulePromise=null;throw error});return pdfModulePromise}
function stopPdfThumbnails(){pdfObserver?.disconnect();for(const task of pdfRenderTasks)task.cancel();pdfRenderTasks.clear()}
function pdfDocument(id){return pdfState.documents.find(d=>d.id===id)}
function pdfVisibleRows(){return pdfState.pages.slice(pdfState.page*12,pdfState.page*12+12)}
